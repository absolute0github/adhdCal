name: Deploy to Cloudways

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            REPO_DIR=~/adhdCal
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/absolute0github/adhdCal.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            npm install
            # Write client env vars for Vite build
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > "$REPO_DIR/client/.env"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> "$REPO_DIR/client/.env"
            npm run build
            npx pm2 delete timekit 2>/dev/null; npx pm2 restart adhdcal 2>/dev/null || npx pm2 start ecosystem.config.cjs
