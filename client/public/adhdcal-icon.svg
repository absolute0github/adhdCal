<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <!-- Calendar body -->
  <rect x="7" y="10" width="18" height="15" rx="2" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Calendar top hooks -->
  <line x1="12" y1="7" x2="12" y2="12" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="7" x2="20" y2="12" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Calendar divider line -->
  <line x1="7" y1="14" x2="25" y2="14" stroke="white" stroke-width="1.5"/>
  <!-- Checkmark -->
  <polyline points="12,19 15,22 21,16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
